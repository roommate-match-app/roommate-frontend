# Nginx для продакшена: раздаёт статику SPA и проксирует API на backend.
# Предполагается, что контейнер фронтенда находится в той же Docker-сети,
# что и сервис `api` (см. Dockerfile и README «Деплой»).
# Если фронтенд и бэкенд на разных хостах — замените `http://api:8000`
# на публичный адрес бэкенда или задайте VITE_API_URL при сборке.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket чата
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # SPA: любые маршруты отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
